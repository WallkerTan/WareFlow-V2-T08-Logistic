spring.config.import=
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.datasource.url=${FINANCE_TEST_DB_URL:jdbc:h2:mem:finance;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${FINANCE_TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${FINANCE_TEST_DB_USER:sa}
spring.datasource.password=${FINANCE_TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=${FINANCE_TEST_DB_DIALECT:org.hibernate.dialect.H2Dialect}
wareflow.finance.timezone=Asia/Ho_Chi_Minh
