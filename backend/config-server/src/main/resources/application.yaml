server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: ${CONFIG_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: file:../config-repo,file:./config-repo,file:../../config-repo
        git:
          uri: https://github.com/WallkerTan/wareflow-v2-config-repo
          default-label: main
          clone-on-start: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
