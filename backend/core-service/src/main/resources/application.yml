server:
  port: 8081

spring:
  application:
    name: core-service
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wareflow_core}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

wareflow:
  jwt:
    # Base64 encoded, tối thiểu 32 bytes. Override bằng biến môi trường khi deploy.
    secret: ${JWT_SECRET:Y3Vyb3VyZS1uZWVkcy1hLXNlY3JldC1rZXktbWluaW11bS0zMi1ieXRlcy1sb25nISE=}
    access-token-ttl: PT8H
    issuer: wareflow-auth

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dx4ym1xrj}
  api-key: ${CLOUDINARY_API_KEY:278296519696876}
  api-secret: ${CLOUDINARY_API_SECRET:278296519696876}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
