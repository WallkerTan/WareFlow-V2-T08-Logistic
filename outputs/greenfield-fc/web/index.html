<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreenField FC | Đội hình</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="images/greenfield-logo.png" alt="GreenField FC" />
      <h1>GreenField FC</h1>
      <p>Đội bóng của chúng ta</p>
    </header>
    <main>
      <h2>Danh sách cầu thủ</h2>
      <p id="status">Đang tải danh sách...</p>
      <table>
        <thead>
          <tr>
            <th>Số áo</th>
            <th>Họ tên</th>
            <th>Vị trí</th>
          </tr>
        </thead>
        <tbody id="players"></tbody>
      </table>
    </main>
    <script src="app.js"></script>
  </body>
</html>
